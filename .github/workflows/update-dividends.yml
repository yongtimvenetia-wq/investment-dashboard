name: Update dividends

on:
  schedule:
    - cron: "17 13 * * *"   # every day around 5-6am Pacific
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/update_dividends.py
        env:
          SUPABASE_URL: https://ebamjhuteebmtfxvppfs.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Publish if anything changed
        run: |
          if git diff --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "dividend-bot"
          git config user.email "dividend-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update dividend schedules"
          git push
